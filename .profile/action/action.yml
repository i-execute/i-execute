name: Execute Card

runs:
  using: composite
  steps:
    - name: Render
      shell: bash
      run: node "$GITHUB_ACTION_PATH/render.js"
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Commit
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A storage README.md .profile
        git diff --cached --quiet || (git commit -m "$MESSAGE" && git push)
      env:
        MESSAGE: Updated profile
