name: Execute Card

on:
  schedule:
    - cron: "0 */9 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .github/workflows/execute-card.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.profile/action
